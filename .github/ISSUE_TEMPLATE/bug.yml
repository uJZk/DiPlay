name: Connection, display or audio problem
description: Help us reproduce an issue with TiPlay on your head unit or phone.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Test while parked. Reports are public: review diagnostic files and remove personal information before attaching them. Never post credentials. Report problems with upstream DiPlay at https://github.com/shihabal3amri/DiPlay instead.'
  - type: input
    id: version
    attributes: {label: TiPlay version or commit, placeholder: '0.2.13 or a commit hash'}
    validations: {required: true}
  - type: input
    id: car
    attributes: {label: Car and head-unit model, placeholder: 'Car model/year, head unit, DiLink/Android or Tesla software version and exact firmware'}
    validations: {required: true}
  - type: input
    id: phone
    attributes: {label: iPhone model and exact iOS version}
    validations: {required: true}
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: ['Wireless: built-in car hotspot', 'Wireless: Wi-Fi Direct', 'Wireless: Existing Wi-Fi / Same LAN', USB, Both, 'Other / unsure']
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: 'Include expected behavior, steps, relevant settings and the approximate failure time. For wireless, include the backend, band/channel if shown, and whether the car is also connected to another Wi-Fi network. For Same LAN, include the router model and whether client isolation is enabled.'
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report or recording
      description: 'Reproduce on the latest TiPlay build, then Settings → Diagnostics → Save diagnostic report. Android 10+ normally saves to Downloads/TiPlay; Android 9 uses a document picker. If storage is unavailable, use View report or Share in the confirmation. Review the text before attaching it and never include your hotspot password. Include the approximate failure time.'
