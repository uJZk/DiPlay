<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c121c">
<meta name="referrer" content="no-referrer">
<!-- The phone address is typed by the driver, and CSP host sources cannot express IP ranges, so connect-src allows http:.
     media-src blob: is for the MSE fallback, whose <video> plays a MediaSource object URL. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http:; media-src 'self' blob:; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>TeslaPlay</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header id="bar">
<strong class="brand">TeslaPlay</strong>
<p id="status" role="status" aria-live="polite"></p>
<nav>
<button id="fit" class="primary" type="button" data-i18n="fit" hidden></button>
<button id="stats-toggle" type="button" data-i18n="stats" aria-pressed="false" hidden></button>
<button id="fullscreen" type="button" data-i18n="fullscreen"></button>
<button id="disconnect" type="button" data-i18n="disconnect" hidden></button>
</nav>
</header>
<main>
<section id="panel" aria-labelledby="title">
<form id="link-form" novalidate>
<h1 id="title" data-i18n="heading"></h1>
<p data-i18n="intro"></p>
<label for="code" data-i18n="codeLabel"></label>
<input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required>
<details id="advanced">
<summary data-i18n="advanced"></summary>
<label for="host" data-i18n="hostLabel"></label>
<input id="host" name="host" inputmode="decimal" autocomplete="off" spellcheck="false">
<p class="hint" data-i18n="hostHelp"></p>
</details>
<button id="connect" class="primary" type="submit" data-i18n="connect"></button>
<p id="message" role="alert"></p>
</form>
<footer><a href="https://github.com/uJZk/DiPlay" data-i18n="source"></a></footer>
</section>
<section id="stage" hidden>
<canvas id="screen"></canvas>
<video id="video" muted playsinline disablepictureinpicture disableremoteplayback hidden></video>
<div id="touch" aria-hidden="true"></div>
<pre id="stats" hidden></pre>
</section>
</main>
<noscript>TeslaPlay needs JavaScript. · TeslaPlay 需要 JavaScript。</noscript>
</body>
</html>
